  <meta charset="UTF-8" />

  <meta name="theme-color" content="#BA2F30" />

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

          name="apple-mobile-web-app-title"
          content="SafeMama Nigeria Admin"

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico" />

  <title>SafeMama Nigeria Admin</title>
  <link rel="manifest" href="manifest.json" />

  <style>
    body {
      background-color: #FCFEFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #FCFEFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .splash-avatar-wrapper {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-spinner {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid rgba(186, 47, 48, 0.12);
      border-top: 5px solid #BA2F30;
      border-right: 5px solid #BA2F30;
      animation: spin 1.1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-sizing: border-box;
    }

    .splash-logo-circle {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 12px 35px rgba(186, 47, 48, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 2;
      animation: pulse 2s ease-in-out infinite alternate;
    }

    .splash-logo-circle img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .splash-title {
      margin-top: 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #BA2F30;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .splash-subtitle {
      margin-top: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #848484;
      letter-spacing: 0.2px;
      text-align: center;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.96);
      }
      100% {
        transform: scale(1.04);
      }
    }
  </style>

<body>
<!-- Custom Web Splash Screen -->
<div id="splash-screen">
  <div class="splash-avatar-wrapper">
    <div class="splash-spinner"></div>
    <div class="splash-logo-circle">
      <img src="icons/icon-192.png" alt="SafeMama Logo" />
    </div>
  </div>

  <div class="splash-title">SafeMama Nigeria</div>
  <div class="splash-subtitle">Admin Dashboard</div>
</div>

<!-- Modern Flutter Bootstrap -->
<script>
  {{flutter_bootstrap_js}}
</script>

<script>
  window.addEventListener("flutter-first-frame", function () {
    const splash = document.getElementById("splash-screen");

    if (splash) {
      splash.classList.add("fade-out");

      setTimeout(function () {
        splash.remove();
      }, 500);
    }
  });
</script>
